<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第七章 · 转场比较</title><style>
*{box-sizing:border-box}body{margin:0;background:#17130f;color:#eadcc4;font:17px/1.8 'Songti SC',serif;padding:30px 4vw}h1{font-size:30px;font-weight:normal;margin:0 0 8px}p{margin:8px 0 20px;max-width:920px}button,a{font:inherit;color:inherit;background:#35291d;border:1px solid #907448;padding:8px 18px;cursor:pointer;text-decoration:none}button:hover{background:#4a3824}button:disabled{opacity:.45;cursor:wait}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button[aria-pressed=true]{background:#79603b}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{min-width:0}.card h2{font-size:21px;font-weight:normal}.card p{font-size:16px;min-height:88px;color:#c5b49a}.sample{aspect-ratio:16/9;position:relative;overflow:hidden;background:#000;border:1px solid #66513b}.sample img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.sample .memory-old{object-fit:contain}.card button{width:100%}.status{min-height:30px;font-size:15px;color:#cdb98c}.footer{margin-top:28px;font-size:15px;color:#ac9980}@media(max-width:1050px){.options{grid-template-columns:1fr}.card{max-width:850px}.card p{min-height:0}.sample{max-height:60vh;aspect-ratio:16/9}.card button{width:auto}}
</style><h1>从书桌走进回忆</h1><p>每种转场都是约3.6秒。可以切换戒指与契据，单独重播，也可以同时播放比较。游戏已选用缓慢叠化；其他两种保留供对照。</p><div class="controls"><button id="ring" aria-pressed="true">戒指 · 婚姻</button><button id="deed" aria-pressed="false">契据 · 庄园</button><button id="all">同时播放三种</button></div><main class="options"></main><p class="footer">这页只演示视觉效果，不改变游戏进度。<a href="./chapter6.html?preview=1&start=epilogue">从第六章末幕试玩</a></p><script type="module">
import {playMemoryTransition} from './src/ui/memory-transition.js';
const options=[['crossfade','一 · 缓慢叠化（已选用）','书桌逐渐淡去，回忆慢慢浮现，并有很轻的推进。节奏温和，较适合这个结尾。'],['iris','二 · 从物件展开','回忆从戒指或契据所在位置向外展开，强调眼前物件与过去之间的联系。'],['black','三 · 黑场停顿','书桌先淡入黑暗，稍停一瞬，再显出回忆。时间跳转更明确，停顿感也更强。']];let selected='ring',active=0;
const main=document.querySelector('main');main.innerHTML=options.map(([id,title,description])=>`<section class="card" data-kind="${id}"><h2>${title}</h2><div class="sample"><img class="memory-old" src="./assets/chapter7/e01-book-closed.webp" alt="书桌"><img class="memory-new" src="./assets/chapter7/s12-honesty.webp" alt="回忆" style="opacity:0"></div><p>${description}</p><button>播放这一种</button><div class="status" aria-live="polite"></div></section>`).join('');
function controls(){for(const b of document.querySelectorAll('button'))b.disabled=active>0;}
function select(name){selected=name;document.querySelector('#ring').setAttribute('aria-pressed',name==='ring');document.querySelector('#deed').setAttribute('aria-pressed',name==='deed');for(const box of document.querySelectorAll('.sample')){box.style.setProperty('--focus-x',name==='ring'?'68.5%':'21%');box.style.setProperty('--focus-y',name==='ring'?'43.2%':'72.8%');box.querySelector('.memory-old').style.opacity=1;const im=box.querySelector('.memory-new');im.src='./assets/chapter7/'+(name==='ring'?'s12-honesty':'s15-manor')+'.webp';im.style.opacity=0;im.style.clipPath='none';}for(const status of document.querySelectorAll('.status'))status.textContent='';}
async function play(card){active++;controls();const box=card.querySelector('.sample'),old=box.querySelector('.memory-old'),next=box.querySelector('.memory-new');card.querySelector('.status').textContent='播放中……';try{await Promise.all([old.decode(),next.decode()]);await playMemoryTransition(box,old,next,{kind:card.dataset.kind});card.querySelector('.status').textContent='播放完毕 · 可再次比较';}catch{card.querySelector('.status').textContent='画面未载入，请重试。';}finally{active--;controls();}}
for(const card of main.children)card.querySelector('button').onclick=()=>play(card);document.querySelector('#ring').onclick=()=>select('ring');document.querySelector('#deed').onclick=()=>select('deed');document.querySelector('#all').onclick=()=>{for(const card of main.children)void play(card);};select('ring');
</script></html>
