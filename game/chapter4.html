<!doctype html><html lang="zh-CN"><head><script src="./src/ui/cover-entry.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣遗物 · 第四章</title><link rel="stylesheet" href="./styles/chapter4/game.css"><link rel="stylesheet" href="./styles/paged-dialogues.css"><link rel="stylesheet" href="./styles/chapter4/scroll.css"></head><body>
<header><span>圣遗物 <i>第四章</i></span><span id="place"></span><div><button id="sound" aria-label="切换声音">声音开</button><button id="pause">设置</button></div></header>
