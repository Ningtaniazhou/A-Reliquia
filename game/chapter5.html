<!doctype html><html lang="zh-CN"><head><script src="./src/ui/cover-entry.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣遗物 · 第五章</title><link rel="stylesheet" href="styles/voyage/game.css"><link rel="stylesheet" href="styles/voyage/backpack.css"><link rel="stylesheet" href="styles/jerusalem.css"><link rel="stylesheet" href="styles/chapter5/game.css"><link rel="stylesheet" href="./styles/ui/scholar-attention.css"></head><body>
<main id="voyage"><div class="voyage-screen" tabindex="-1" data-scene="jerusalem"><div class="voyage-stage"><canvas width="960" height="540" aria-label="清晨营地，A D 行走，靠近物件按 E 交互"></canvas><div class="voyage-markers" id="markers"></div></div>
<header class="voyage-hud"><span class="voyage-place">第五章 · 耶里哥营地</span><button id="bag-button">背包 <kbd>Tab</kbd></button></header>
<nav class="utilities" aria-label="声音与设置"><button id="sound" aria-label="关闭声音"></button><button id="settings-open" aria-label="设置">设置<kbd>P</kbd></button></nav>
<button id="scholar" class="j-scholar" aria-label="询问托普修斯 R"><img src="assets/malta/topsius-portrait.png" alt="托普修斯"><kbd>R</kbd><i>●</i></button>
<div class="j-objective" id="hint">清晨营地 · 与波特交谈</div>
<section id="talk" class="j-talk" role="dialog" aria-label="交谈" hidden><small></small><p></p><button id="previous" aria-label="上一页 A">‹</button><button id="next" aria-label="下一页 D">›</button><button id="close-talk" data-close>返回 <kbd>Esc</kbd></button></section>
<section id="choices" class="j-menu" role="dialog" hidden><h2>今早想吃些什么？</h2><div><button data-meal="tapioca">木薯羹，甜些、软些。</button><button data-meal="coffee">一杯热咖啡。</button></div><footer>W / S 选择 · 空格确认 · Esc 返回</footer></section>
<section class="voyage-bag" role="dialog" aria-labelledby="backpack-title" hidden></section><section id="journey" class="j-black" aria-label="途中" hidden><p></p><button id="travel-error" hidden>未能载入下一处，点击重试</button></section><section id="arrival-end" hidden><p>里斯本 · 姨姨家</p><button id="chapter6-continue">走进家门</button></section><div id="load" class="j-loading"><span></span><button id="retry" hidden>重试</button></div><p id="save-warning" class="j-save-warning" hidden>浏览器未能保存本段进度。</p></div></main>
<dialog id="settings"><form method="dialog"><h2>设置 · 已暂停</h2><p class="keyboard-guide">A / D 或方向键　行走<br>E　靠近后交互<br>A / D　对白上一页 / 下一页<br>空格　继续对白 / 确认选项<br>D / 空格　提前结束黑幕旁白<br>W / S　选择选项<br>R　询问托普修斯<br>Tab　背包<br>Esc　返回 / 设置<br>M　声音开关；P　设置</p><label>音量<input id="volume" type="range" min="0" max="1" step=".05"></label><button id="resume">返回游戏 <kbd>Esc</kbd></button></form></dialog>
<script type="module" src="src/chapter5/app.js"></script><script type="module" src="src/ui/nonverbal.js"></script></body></html>
