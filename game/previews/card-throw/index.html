<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弧线甩牌 · 轻力度有声试玩</title><style>
*{box-sizing:border-box}body{margin:0;background:#120e14;color:#eedec0;font-family:'Songti SC',serif}header{height:86px;display:flex;align-items:center;justify-content:center;gap:16px}button{font:16px inherit;color:inherit;background:#31222b;border:1px solid #9c7f51;padding:10px 18px;cursor:pointer}button.active{background:#735438;border-color:#e9c889}header small{color:#b8a58b}#viewport{position:relative;width:min(100vw,calc((100dvh - 100px)*1.6));aspect-ratio:1.6;margin:auto;overflow:hidden}#stage{position:absolute;width:1440px;height:900px;transform-origin:0 0;overflow:hidden}#art{position:absolute;inset:0;background:url(stage.png) center/cover}#cards{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);display:flex;gap:22px}.card{width:166px;height:266px;background:linear-gradient(145deg,#48212b,#21131c);border:2px solid #b89a5b;border-radius:8px;outline:1px solid #997b49;outline-offset:-6px;padding:8px;box-shadow:0 8px 22px #0008;text-align:center}.card img{display:block;width:100%;height:158px;object-fit:cover;border:1px solid #c6a16b}.card h3{font-size:17px;font-weight:400;margin:10px 0 6px}.card p{font-size:14px;line-height:1.5;margin:0}.flying{position:absolute;z-index:10;pointer-events:none;transform-origin:center;will-change:transform}.ring{position:absolute;left:0;top:0;border:2px solid #e7c78b;border-radius:50%;width:140px;height:140px;pointer-events:none;z-index:12;box-shadow:0 0 12px #dba74766}.spark{position:absolute;width:3px;height:12px;background:#ffe9ae;z-index:13;pointer-events:none;box-shadow:0 0 4px #ffd58266}#caption{position:absolute;bottom:38px;width:100%;text-align:center;color:#f9e0aa;font-size:21px;text-shadow:0 2px 5px #000}#wash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 38%,#f4d69a55,transparent 35%)}
</style><header><span>弧线甩牌 · 轻力度</span><button id="sound" aria-pressed="true">声音：开</button><button id="replay">播放 / 重播</button><small>圣光 / 怒意音效 · 敬神乳香正确，其余两张错误</small></header><div id="viewport"><div id="stage"><div id="art"></div><div id="wash"></div><div id="cards"></div><div id="caption">点击卡牌：甩牌声 → 命中声 → 正确 / 错误结果音效</div></div></div><script>
const stage=document.querySelector('#stage'),viewport=document.querySelector('#viewport'),cards=document.querySelector('#cards'),caption=document.querySelector('#caption');let mode='a',busy=false;
const data=[['敬神乳香','是敬神的乳香，姨姨。',3],['时髦香水','是我新买的香水。',4],['女士的礼物','是一位女士送我的。',5]];
cards.innerHTML=data.map(([name,text,n])=>`<button class="card"><img src="../../assets/chapter6/card-${String(n).padStart(2,'0')}.webp"><h3>${name}</h3><p>${text}</p></button>`).join('');
function fit(){stage.style.transform=`scale(${viewport.clientWidth/1440})`;}window.addEventListener('resize',fit);fit();
let ctx,master,muted=false;
function unlock(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.42;master.connect(ctx.destination);}if(ctx.state==='suspended')ctx.resume().catch(()=>{caption.textContent='声音未能启动，请再次点击声音按钮';});}
function noise(duration,level,from,to){if(!ctx||muted||document.hidden)return;const t=ctx.currentTime,buffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*duration),ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=buffer;filter.type='bandpass';filter.Q.value=.65;filter.frequency.setValueAtTime(from,t);filter.frequency.exponentialRampToValueAtTime(to,t+duration);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(level,t+duration*.24);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);source.connect(filter);filter.connect(gain);gain.connect(master);source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect();};source.start(t);source.stop(t+duration);}
function impactSound(){noise(.16,.15,1050,420);if(!ctx||muted||document.hidden)return;const t=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(290,t);osc.frequency.exponentialRampToValueAtTime(190,t+.15);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.09,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+.19);osc.connect(gain);gain.connect(master);osc.onended=()=>{osc.disconnect();gain.disconnect();};osc.start(t);osc.stop(t+.2);}
// New result cues: gentle plucked consonance vs a muted, descending tension chord.
function resultNote(freq,delay,duration,level,tension=false){const t=ctx.currentTime+delay;const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=tension?1100:2400;filter.Q.value=.5;filter.connect(master);let remaining=3;for(const [ratio,weight] of [[1,1],[2,.22],[3,.07]]){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq*ratio,t);if(tension)osc.frequency.exponentialRampToValueAtTime(freq*ratio*.94,t+duration);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(level*weight,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain);gain.connect(filter);osc.onended=()=>{osc.disconnect();gain.disconnect();if(!--remaining)filter.disconnect();};osc.start(t);osc.stop(t+duration+.02);}}
// Result sound design: a luminous, rising halo versus a restrained orchestral anger sting.
function haloSound(){
 const t=ctx.currentTime,bus=ctx.createGain(),delay=ctx.createDelay(.5),echo=ctx.createGain();bus.gain.value=.65;bus.connect(master);delay.delayTime.value=.145;echo.gain.value=.20;bus.connect(delay);delay.connect(echo);echo.connect(master);
 let count=8;const done=()=>{if(!--count)setTimeout(()=>{bus.disconnect();delay.disconnect();echo.disconnect();},500);};
 for(const [i,f] of [523.25,659.25,783.99,1046.5].entries())for(const detune of [-4,4]){
 const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f*.985,t);osc.frequency.exponentialRampToValueAtTime(f,t+.28);osc.detune.value=detune;const start=t+i*.045;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.050-i*.006,start+.22);g.gain.exponentialRampToValueAtTime(.0001,start+1.55);osc.connect(g);g.connect(bus);osc.onended=()=>{osc.disconnect();g.disconnect();done();};osc.start(start);osc.stop(start+1.6);}
 resultNote(1567.98,.20,.85,.035);resultNote(2093,.33,.95,.023);
}
function angerSound(){
 const t=ctx.currentTime;
 // Low, filtered brass-like tension: a sharp onset, slight swell, then a firm cutoff.
 for(const [f,level] of [[110,.09],[116.54,.035],[164.81,.045]]){const osc=ctx.createOscillator(),filter=ctx.createBiquadFilter(),g=ctx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(f,t);osc.frequency.exponentialRampToValueAtTime(f*.89,t+.55);filter.type='lowpass';filter.Q.value=.75;filter.frequency.setValueAtTime(380,t);filter.frequency.exponentialRampToValueAtTime(950,t+.07);filter.frequency.exponentialRampToValueAtTime(260,t+.65);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(level,t+.035);g.gain.exponentialRampToValueAtTime(level*.4,t+.20);g.gain.exponentialRampToValueAtTime(level*.68,t+.34);g.gain.exponentialRampToValueAtTime(.0001,t+.73);osc.connect(filter);filter.connect(g);g.connect(master);osc.onended=()=>{osc.disconnect();filter.disconnect();g.disconnect();};osc.start(t);osc.stop(t+.78);}
 noise(.13,.11,680,180);
}
function resultSound(correct){window.previewLastResult=correct?'correct':'wrong';if(!ctx||muted||document.hidden)return;correct?haloSound():angerSound();}
document.querySelector('#sound').onclick=()=>{unlock();muted=!muted;master.gain.setTargetAtTime(muted?0:.42,ctx.currentTime,.015);document.querySelector('#sound').textContent='声音：'+(muted?'关':'开');document.querySelector('#sound').setAttribute('aria-pressed',String(!muted));};
document.addEventListener('visibilitychange',()=>{if(ctx){if(document.hidden)ctx.suspend();else ctx.resume().catch(()=>{});}stage.getAnimations({subtree:true}).forEach(a=>document.hidden?a.pause():a.play());});
window.previewAudioState=()=>({state:ctx?.state||'not-started',muted});
const animate=(el,k,opt)=>el.animate(k,{fill:'forwards',...opt}).finished;
async function hit(x,y){const ring=document.createElement('i');ring.className='ring';ring.style.left=x-70+'px';ring.style.top=y-70+'px';stage.append(ring);animate(ring,[{transform:'scale(.15)',opacity:.48},{transform:`scale(1.2)`,opacity:0}],{duration:mode==='a'?540:380,easing:'ease-out'}).then(()=>ring.remove());
for(let i=0;i<6;i++){const p=document.createElement('i');p.className='spark';p.style.left=x+'px';p.style.top=y+'px';stage.append(p);const ang=i*Math.PI*2/6;animate(p,[{transform:`rotate(${ang}rad) scale(.4)`,opacity:.55},{transform:`translate(${Math.cos(ang)*65}px,${Math.sin(ang)*52}px) rotate(${ang+1}rad) scale(.1)`,opacity:0}],{duration:430+Math.random()*180,easing:'ease-out'}).then(()=>p.remove());}
document.querySelector('#art').animate([{transform:'translate(0)'},{transform:`translate(1.5px,.5px)`},{transform:'translate(-1px,0)'},{transform:'translate(.5px,0)'},{transform:'translate(0)'}],{duration:mode==='a'?250:340});document.querySelector('#wash').animate([{opacity:0},{opacity:.24,offset:.2},{opacity:0}],{duration:420});}
async function play(source){if(busy)return;busy=true;unlock();noise(.09,.09,1700,950);window.previewBusy=true;caption.textContent=mode==='a'?'轻抬卡牌 · 弧线甩出 · 柔和落点':'蓄力 → 旋转疾飞 → 短促震动';const s=viewport.clientWidth/1440,r=source.getBoundingClientRect(),o=viewport.getBoundingClientRect();const x=(r.left-o.left)/s,y=(r.top-o.top)/s,tx=720,ty=345,dx=tx-x-83,dy=ty-y-133;const clone=source.cloneNode(true);clone.classList.add('flying');clone.style.left=x+'px';clone.style.top=y+'px';stage.append(clone);source.style.opacity='.16';cards.style.pointerEvents='none';
if(mode==='a'){await animate(clone,[{transform:'translate(0,0) rotate(0) scale(1)'},{transform:'translate(-20px,-42px) rotate(-12deg) scale(1.12)'}],{duration:230,easing:'ease-out'});noise(.38,.18,1900,650);await animate(clone,[{transform:'translate(-20px,-42px) rotate(-12deg) scale(1.12)'},{transform:`translate(${dx*.4-70}px,${dy*.55-120}px) rotate(-24deg) scale(.85)`,offset:.5},{transform:`translate(${dx}px,${dy}px) rotate(12deg) scale(.32)`}],{duration:740,easing:'cubic-bezier(.35,0,.65,.7)'});}else{await animate(clone,[{transform:'scale(1)'},{transform:'translate(0,20px) rotate(-16deg) scale(1.14)',filter:'brightness(1.6) drop-shadow(0 0 12px #d9a74d)'}],{duration:350,easing:'ease-in'});await animate(clone,[{transform:'translate(0,20px) rotate(-16deg) scale(1.14)'},{transform:`translate(${dx*.3}px,${dy*.4}px) rotate(150deg) scale(.7)`,offset:.45},{transform:`translate(${dx}px,${dy}px) rotate(350deg) scale(.3)`}],{duration:390,easing:'cubic-bezier(.6,0,.95,.4)'});}
impactSound();hit(tx,ty);await animate(clone,[{opacity:1,filter:'brightness(1.15)'},{opacity:0,filter:'brightness(1.35)'}],{duration:130});clone.remove();await new Promise(r=>setTimeout(r,110));const correct=source===cards.children[0];resultSound(correct);caption.textContent=correct?'姨姨认可了这个回答 · 原来是教堂的香气。':'姨姨起了疑心 · 你倒把心思都花在这上面了！';await new Promise(r=>setTimeout(r,1850));source.style.opacity='';cards.style.pointerEvents='';busy=false;window.previewBusy=false;caption.textContent=correct?'圣光显现 · 点击另外两张牌试听姨姨的怒意':'姨姨动怒 · 点击敬神乳香试听圣光显现';}
[...cards.children].forEach(c=>c.onclick=()=>play(c));document.querySelector('#replay').onclick=()=>play(cards.children[0]);
</script></html>
