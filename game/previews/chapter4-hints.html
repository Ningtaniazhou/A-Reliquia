<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第四章 · 呼吸光点对比</title><style>
*{box-sizing:border-box}body{margin:0;background:#111921;color:#eee3cb;font:16px system-ui}header{padding:20px 3%;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}button{background:#243340;color:#eee3cb;border:1px solid #a08a60;padding:9px 16px;cursor:pointer}button[aria-pressed=true]{background:#675338}main{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 2%}article{min-width:0}h2{font-size:17px;font-weight:500}p{color:#bac2c7;font-size:14px}.scene{position:relative;aspect-ratio:16/9}.scene img{width:100%;display:block}.dot{position:absolute;left:var(--x);top:var(--y);width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);animation:breathe 2.8s ease-in-out infinite;background:var(--core);border:2px solid #f4d48c;box-shadow:0 0 0 1px #302515,0 0 8px 2px #efc36b88}.a{--core:#254f78}.b{--core:#983e32}.c{--core:#efd080}.c .dot{border:3px solid #39342a;box-shadow:0 0 0 1px #f4d48c,0 0 8px 2px #efc36b88}.dot:after{content:'';position:absolute;inset:-6px;border:1px solid #f3d18c88;border-radius:50%;animation:ripple 2.8s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.82);filter:brightness(.85)}50%{transform:translate(-50%,-50%) scale(1.22);filter:brightness(1.15)}}@keyframes ripple{0%,100%{transform:scale(.8);opacity:.25}50%{transform:scale(1.4);opacity:.7}}footer{padding:18px 3%;color:#bdb49e}.scene button{padding:0;cursor:pointer}.scene button:hover{outline:2px solid white;outline-offset:5px}@media(max-width:1000px){main{grid-template-columns:1fr}.dot{width:16px;height:16px}}
</style><header><h1>第四章 · 呼吸光点对比</h1><button data-scene="garden" aria-pressed="true">花园：白袍与篮子</button><button data-scene="house">宅邸：深浅衣服</button><button data-scene="trial">审判回廊：复杂背景</button></header><main></main><footer>三版使用相同位置、大小与呼吸节奏。点击光点可查看对象名称；这是美术预览，不改变游戏进度。</footer><script type="module">
import {scenes} from '../src/chapter4/content.js';
const variants=[['a','A · 蓝心金环','深蓝中心在白袍上更清楚，金边照顾深色背景。'],['b','B · 朱红心金环','暖红中心与油画色调接近，提示感更强。'],['c','C · 深色细环','金色中心保留原来的光感，以深色轮廓增加对比。']];
function show(id){const s=scenes.find(s=>s.id===id);document.querySelector('main').replaceChildren();for(const [cls,title,desc] of variants){const a=document.createElement('article');a.className=cls;const h=document.createElement('h2');h.textContent=title;a.append(h);const scene=document.createElement('div');scene.className='scene';const im=document.createElement('img');im.src='../assets/chapter4-art-v01/'+s.image+'.webp';scene.append(im);for(const obj of [...s.stories,{name:'托普修斯',box:s.guide}]){const [x,y,w,h]=obj.box;const dot=document.createElement('button');dot.className='dot';dot.style.setProperty('--x',(x+w*.5)*100+'%');dot.style.setProperty('--y',(id==='garden'&&obj.id==='gad'?.30:y+h*.38)*100+'%');dot.setAttribute('aria-label',obj.name);dot.onclick=()=>{a.querySelector('p').textContent=obj.name};scene.append(dot)}a.append(scene);const p=document.createElement('p');p.textContent=desc;a.append(p);document.querySelector('main').append(a)}document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===id)))}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>show(b.dataset.scene));show('garden');
</script></html>
