<!doctype html><html lang="zh-CN"><head><script src="./src/ui/cover-entry.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣遗物 · 第六章</title><link rel="stylesheet" href="styles/interaction-marks.css"><link rel="stylesheet" href="styles/chapter6/game.css"><link rel="stylesheet" href="styles/ui/relic-cards.css"></head><body>
<main id="game" aria-label="第六章 · 返家" tabindex="-1"><div id="stage"><img id="backdrop" alt=""><div id="light"></div><div id="seats"></div><div id="cast"></div><div id="boss-hud" hidden><strong id="boss-name"></strong><div class="meter-line"><span>疑心</span><div id="boss-meter" role="progressbar" aria-label="姨姨的疑心" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="boss-health"></i></div></div></div><div id="saint-halo" hidden aria-hidden="true"></div><div id="props"></div><div id="focus-scene" hidden></div><button id="scene-hotspot" hidden><span class="interaction-point" aria-hidden="true"></span></button><p id="hotspot-caption" hidden></p><div id="fx" aria-hidden="true"></div><div class="stage-edge"></div></div>
<header><span>第六章 · 返家</span><nav><button id="sound" aria-label="声音">♫</button><button id="settings-open">设置</button></nav></header>
<div id="cards" class="relic-cards" aria-label="选择一张圣物卡牌" hidden></div><p id="card-hint" hidden>点击一张圣物卡牌</p>
<button id="action" hidden></button><section id="dialogue" hidden aria-label="剧情对白"><div id="portrait" aria-hidden="true"></div><span id="speaker"></span><p id="words"></p><div class="dialogue-nav"><button id="previous" aria-label="上一句">‹</button><button id="next" aria-label="下一句">›</button></div></section>
<section id="dedication" hidden><p></p><small class="mary-signature"></small><button id="read-done" aria-label="放下纸条"><span class="interaction-point" aria-hidden="true"></span></button></section>
<div id="scene-fade" hidden aria-hidden="true"></div><button id="intertitle" hidden aria-label="晚间旁白"><span id="intertitle-words"></span><span class="intertitle-next" aria-hidden="true">›</span></button><div id="curtains" aria-hidden="true"><div class="cloth left"></div><div class="cloth right"></div></div><button id="reopen" hidden aria-label="拉开幕布"></button>
<section id="ending" hidden></section><div id="load"><p></p><button id="retry" hidden>重试</button></div><p id="save-warning" hidden>浏览器未能保存进度，请勿关闭本页。</p></main>
<dialog id="settings"><h2>设置 · 已暂停</h2><p>点击对白框或右下角箭头翻页，左下角箭头回看<br>点击卡牌直接出牌<br>光点标出可点击的动作；闭幕后点击幕布拉开<br>点击右上角的按钮调整声音或打开设置</p><label>音量 <input id="volume" type="range" min="0" max="1" step=".05"></label><button id="restart-scene">重新开始当前场景</button><button id="resume">返回游戏</button></dialog>

<script type="module" src="src/chapter6/app.js"></script><script type="module" src="src/ui/nonverbal.js"></script></body></html>
