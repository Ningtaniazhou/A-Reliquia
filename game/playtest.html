<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣遗物 · 完整试玩</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#19151c;color:#eadcc3;font:20px/1.8 Georgia,serif}main{max-width:650px;padding:40px}h1{font-weight:400}button{display:block;width:100%;padding:18px;margin:16px 0;background:#352839;color:inherit;border:1px solid #ae925e;font:inherit;cursor:pointer}small{font-size:16px;color:#b9ad9c}</style><main><h1>圣遗物</h1><p>第一章至第七章 · 连续试玩</p><button id="new">从第一章开始</button><button id="continue">继续试玩</button><small>从头开始会备份当前游戏存档，再建立一轮新的进度。第五章返抵里斯本后，点击“走进家门 · 第六章”，第六章结束后继续进入第七章，游玩至片尾。中途退出后，可在这里继续试玩。</small><p id="error" role="status"></p></main><script type="module">
import {resumeChapter,rememberChapter} from './src/ui/mainline.js';
import {restartReading} from './src/book/replay.js';
import {initial,SAVE_KEY} from './src/jerusalem/state.js';
import {arrival} from './src/jerusalem/content.js';
const jerusalem=new URLSearchParams(location.search).get('start')==='jerusalem';
document.getElementById('new').textContent=jerusalem?'从耶路撒冷开始新试玩':'从游戏开头开始新试玩';
if(jerusalem)document.querySelector('main>p').textContent='耶路撒冷雨街 → 圣墓与营地 → 第四至第七章';
document.querySelector('small').textContent='开始新试玩会先备份当前剧情存档，再建立干净的新进度，保留声音和设置。中途退出后可选择“继续试玩”。';
document.getElementById('continue').onclick=()=>location.assign(resumeChapter()||'./index.html?play=1');
document.getElementById('new').onclick=()=>{try{restartReading();if(jerusalem){localStorage.setItem(SAVE_KEY,JSON.stringify({...initial(),arrival:arrival.length}));rememberChapter('jerusalem');}location.assign(jerusalem?'./jerusalem-study.html':'./covers.html');}catch{document.getElementById('error').textContent='无法备份存档，尚未开始新一轮。请检查浏览器存储空间。'}};
</script></html>
