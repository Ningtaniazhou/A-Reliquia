<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140f12"><title>圣遗物 · 斋饭与夜宴</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="./styles/dinner.css">
<link rel="stylesheet" href="./styles/dialogue-navigation.css"></head>
<body>
<main id="dinner" aria-label="斋饭与夜宴，小剧场">
 <header class="playbill"><span class="work">圣遗物 <i>A Relíquia</i></span><span class="act" id="act">第一景 · 斋饭</span><nav aria-label="演出设置"><button id="source" title="原文与改编">原文</button><button id="mute" aria-pressed="false">声音开</button><button id="pause">设置</button></nav></header>
 <section class="theatre" aria-label="故事画面">
  <div class="stage" id="stage" data-scene="meal">
   <img class="backdrop" id="room" src="./assets/dinner/room.webp" alt="紫色饭厅的小舞台，中央一张朴素的餐桌，左右各有一扇门">
   <img class="actor teo" id="teo" src="./assets/dinner/teo-pious.webp" alt="特奥多里科拘谨地坐着，手里捏着面包皮">
   <img class="actor aunt" id="aunt" src="./assets/dinner/aunt-seated.webp" alt="姨姨端坐在餐桌旁">
   <img class="table-front" src="./assets/dinner/room.webp" alt="" aria-hidden="true">
   <div class="stage-shade" aria-hidden="true"></div>
   <img class="outside" id="street" src="./assets/dinner/street.webp" alt="夜色中的里斯本街道">
   <img class="outside" id="feast" src="./assets/dinner/feast.webp" alt="特奥多里科和阿德里亚笑着共进丰盛夜宵">
   <div class="light-warmth" aria-hidden="true"></div>
   <button id="side-door" class="door-hotspot" aria-label="从舞台右侧的小门溜出去" hidden><span>溜出去 <i>Sair</i> →</span></button>
   <div class="curtain" id="curtain" aria-hidden="true"><div class="curtain-folds"></div><div class="curtain-hem"></div></div>
   <div class="blackout" aria-hidden="true"></div>
   <p class="motion-caption" id="motion-caption" aria-live="polite"></p>
   <div id="load-error" class="load-error" hidden><p>有一幅场景还没有准备好。</p><button id="retry">重新载入</button></div>
  </div>
 </section>
 <section class="subtitle" id="subtitle" aria-live="polite" aria-atomic="true"><div class="speaker-line"><span id="speaker"></span><span id="text-kind"></span></div><div class="bilingual"><p id="zh"></p><p id="pt" lang="pt-PT"></p></div><nav class="dinner-corners"><button id="back" aria-label="回看上一段">‹</button><button id="next" aria-label="下一段">›</button></nav></section>
 <footer class="controls"><span class="progress" id="progress">斋饭 · 夜宴</span></footer>
</main>
<dialog id="settings"><form method="dialog"><h2>设置</h2><p>故事停在这里，等你回来。</p><label class="setting"><input id="reduced" type="checkbox"> 减少动态</label><label class="setting">音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.35"></label><div class="dialog-actions"><button id="restart" type="button">从这顿斋饭重演</button><button class="next">继续观演</button></div><small>空格／回车推进 · Esc 暂停 · ‹<br>进度仅保存在本机，此片段与开场存档分开。</small></form></dialog>
<dialog id="sources"><form method="dialog"><h2>原文与这场演出</h2><div id="source-list"></div><button class="next">回到故事</button></form></dialog>
<script type="module" src="./src/dinner/app.js"></script>
<script type="module" src="./src/dialogue-portraits.js"></script><script type="module" src="src/ui/nonverbal.js"></script></body></html>
